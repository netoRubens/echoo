<style>
:root{--red:#D8082F;--rt:#D8082F;--on:#EEE6DD;--bg:#EEE6DD;--bg2:#E6DCCF;--bg3:#DBCFC0;--fg:#1E140B;--mu:#6b5d52;--ln:rgba(30,20,11,.18);--lns:rgba(30,20,11,.5);--ok:#2E7D4F;--wn:#B8860B;--dn:#D8082F;

:root[data-t="dark"]{--bg:#17110d;--bg2:#1f1812;--bg3:#2b2219;--fg:#EEE6DD;--mu:#a79a8d;--ln:rgba(238,230,221,.15);--lns:rgba(238,230,221,.45);--ok:#58c487;--wn:#e0b042;color-scheme:dark}
*{box-sizing:border-box;margin:0;scrollbar-width:thin;scrollbar-color:var(--lns) transparent}[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:4px;border:1px solid var(--red);opacity:.45;pointer-events:none;z-index:5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:transparent;border:2px solid var(--fg);border-radius:0;padding:9px 10px;width:100%}
select option{background:var(--bg);color:var(--fg)}input::placeholder{color:var(--mu)}
:focus-visible{outline:3px solid var(--rt);outline-offset:2px}
small,.mu{color:var(--mu)}
.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.tag{font:800 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:14px;min-height:40px;padding:0 16px;border:2px solid currentColor;font:400 16px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.red{background:var(--red);color:var(--on);border-color:var(--red)}.btn.red:hover{background:transparent;color:var(--rt)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}.btn.go::after{content:"↗";font-family:var(--body);font-weight:800}
.ib{width:32px;height:32px;display:grid;place-items:center;color:var(--mu);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--bg3);color:var(--fg)}.ib svg,.cb svg,.ri svg,.hi svg{fill:currentColor}.ib svg{width:19px;height:19px}.ib.off{color:var(--rt)}
.nb{background:var(--red);color:var(--on);padding:1px 6px;font:800 10px var(--body);margin-left:6px}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv{animation:rv .3s ease both}
html[data-rm] *,html[data-rm] *::before{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
/* trilho de servidores */
#rail{width:68px;flex:none;background:var(--red);color:var(--on);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;overflow-y:auto;scrollbar-width:none;z-index:6}

.ri{width:44px;height:44px;border:2px solid rgba(238,230,221,.55);color:var(--on);display:grid;place-items:center;font:400 19px var(--disp);position:relative;overflow:hidden;transition:background .2s,color .2s,border-color .2s}
.ri:hover,.rw.on .ri{background:var(--on);color:var(--red);border-color:var(--on)}.ri svg{width:20px;height:20px}.ri img{width:100%;height:100%;object-fit:cover}
.rs{width:28px;height:1px;background:rgba(238,230,221,.5)}
.bd{position:absolute;right:2px;bottom:2px;width:9px;height:9px;background:var(--on);border:2px solid var(--red)}
/* coluna lateral */
#side{width:248px;flex:none;background:var(--bg2);border-right:1px solid var(--lns);display:flex;flex-direction:column}

.svh{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;font:400 22px/1 var(--disp);text-transform:uppercase;padding:4px 2px}

.scroll{flex:1;overflow-y:auto;padding:6px 8px 12px}
.lb{display:flex;justify-content:space-between;align-items:center;color:var(--mu);padding:16px 6px 6px;border-top:1px solid var(--ln);margin-top:8px}.lb:first-child{border-top:0;margin-top:0}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;color:var(--mu);border-left:3px solid transparent}

#vc small{color:var(--on);opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#vc .ib{color:var(--on)}#vc .ib:hover{background:var(--on);color:var(--red)}
#user{display:flex;align-items:center;gap:4px;padding:8px;border-top:1px solid var(--lns)}
.uarea{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;padding:4px}.uarea:hover{background:var(--bg3)}
.un{flex:1;min-width:0}.un b,.un small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.un b i{font-style:normal;color:var(--mu);font-weight:400;margin-left:4px;font-size:11px}.un small{font-size:11px}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;object-fit:cover;display:grid;place-items:center;flex:none;font:400 calc(var(--s)*.5) var(--disp);color:#EEE6DD;cursor:pointer}
.avw{position:relative;display:flex}.dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--mu);border:3px solid var(--bg2)}
.dot.online{background:var(--ok)}.dot.idle{background:var(--wn)}.dot.dnd{background:var(--dn)}
/* área principal */
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
body.incall #main{flex:0 0 380px;border-left:1px solid var(--lns)}
#home,#chatcol{flex:1;display:flex;flex-direction:column;min-height:0}

#hwrap{flex:1;display:flex;min-height:0}

#hq{max-width:420px;padding:8px 10px;border-width:0 0 2px 0}
.fr{display:flex;align-items:center;gap:14px;padding:12px 6px;border-top:1px solid var(--ln)}.fr:hover{background:var(--bg2)}

.rnd{width:36px;height:36px;border:2px solid var(--ln)}.rnd:hover{border-color:var(--fg)}.rnd.ok{color:var(--ok)}.rnd.no{color:var(--rt)}
#act{width:290px;flex:none;border-left:1px solid var(--lns);padding:18px;overflow-y:auto}body.incall #act{display:none}

.afr{display:flex;gap:10px;max-width:520px}.afr .btn{flex:none}
#top{min-height:60px;padding:10px 20px;border-bottom:1px solid var(--lns);display:flex;align-items:center;gap:12px}
.tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.tt b{font-size:28px}.tt small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
#msgs{flex:1;overflow-y:auto;padding:10px 20px 14px}

#f{padding:0 20px 18px}#f input{padding:13px 14px;font-size:15px}
/* call */
#callcol{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--red);color:var(--on)}
#ct{padding:16px 24px 0;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid rgba(238,230,221,.5);padding-bottom:10px}#ct b{font-size:30px}
#stage{flex:1;min-height:0;position:relative;background:#000;display:flex;margin:14px 24px 0;border:1px solid rgba(238,230,221,.6)}

video{width:100%;height:100%;object-fit:contain;background:#000}
#mine{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;background:#1E140B;color:var(--on);padding:24px}#mine b{font-size:40px}#mine p{opacity:.8;max-width:38ch;margin:0 auto}
#vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .2s;color:#EEE6DD}
#stage:hover #vbar,#stage:fullscreen #vbar{opacity:1}.sp{flex:1}#vbar .ib{color:#EEE6DD}#vbar .ib:hover{background:#EEE6DD;color:#1E140B}
#stage:fullscreen{margin:0;border:0;background:#000}
#tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center;padding:20px 24px;flex:1}
#callcol.live #tiles{flex:0 0 112px;padding:12px 24px;gap:10px;align-content:flex-start;overflow:hidden}
.tile{width:210px;height:150px;border:1px solid rgba(238,230,221,.6);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;position:relative}
.tile .av{--s:72px;border:2px solid var(--on)}.tile span{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase}
.tile.speaking{background:rgba(238,230,221,.16);box-shadow:inset 0 0 0 3px var(--on)}
.mm{position:absolute;right:8px;top:6px;font-style:normal}.mm svg{width:18px;height:18px;fill:currentColor}
#callcol.live .tile{width:128px;height:86px;gap:4px}#callcol.live .tile .av{--s:36px}#callcol.live .tile span{font-size:10px}
#ctl{display:flex;gap:12px;justify-content:center;padding:14px;border-top:1px solid rgba(238,230,221,.5)}
.cb{width:52px;height:52px;border:2px solid var(--on);color:var(--on);display:grid;place-items:center;transition:background .2s,color .2s}
.cb:hover{background:var(--on);color:var(--red)}.cb svg{width:24px;height:24px}.cb.off{background:var(--on);color:var(--red)}.cb.live{background:#1E140B;border-color:#1E140B}.cb.end{background:#1E140B;border-color:#1E140B;color:var(--on)}.cb.end:hover{background:var(--on);color:#1E140B}
/* ligação */
#ring{position:fixed;top:18px;right:18px;width:330px;background:var(--red);color:var(--on);border:2px solid var(--on);padding:16px;display:grid;gap:12px;z-index:50;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
#ring .rr{display:flex;align-items:center;gap:12px}#ring .rr b{font-size:30px}#ring .rb{display:flex;gap:10px}#ring .btn{flex:1;color:var(--on)}
#ring .rr .av{border:2px solid var(--on)}@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(238,230,221,.6)}50%{box-shadow:0 0 0 10px rgba(238,230,221,0)}}#ring .av{animation:pl 1.4s infinite}
/* popover, modal, toast */
#pop{position:fixed;left:8px;bottom:62px;width:300px;background:var(--bg);border:2px solid var(--fg);z-index:35;padding-bottom:6px}
#pop.sv{left:76px;top:56px;bottom:auto;width:230px;padding:6px}
#pop .bn{height:84px;border-bottom:1px solid var(--fg)}#pop .pc{margin:-32px 14px 0;position:relative;display:flex}#pop .pc .av{--s:64px;border:4px solid var(--bg)}
#pop .pc .dot{left:50px;bottom:0;width:18px;height:18px;border:4px solid var(--bg)}#pop .pb{padding:8px 14px 10px}#pop .pb b{font-size:24px}
.pl2{margin:6px 8px;border-top:1px solid var(--ln);padding-top:4px}
.pl2 button,#pop.sv button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px}.pl2 button:hover,#pop.sv button:hover{background:var(--bg3)}
.pl2 svg,#pop.sv svg{width:17px;height:17px;fill:currentColor}.rd{color:var(--rt)}
#modal{position:fixed;inset:0;background:rgba(23,17,13,.7);display:none;place-items:center;z-index:40}#modal.on{display:grid}
#mf{background:var(--bg);border:2px solid var(--fg);padding:22px;width:min(500px,92vw);max-height:92vh;overflow:auto;display:grid;gap:14px;animation:rv .25s ease both}#mf.wide{width:min(660px,94vw)}
#mf h3{font-size:30px}#mf label.ck{display:flex;gap:8px;align-items:center}#mf label.ck input{width:auto}
.fl{display:grid;gap:6px}.row{display:flex;gap:10px;justify-content:flex-end}.row2{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:260px;overflow:auto}
.src{position:relative;display:grid;gap:4px;padding:6px;border:2px solid var(--ln);cursor:pointer;font-size:12px}.src input{position:absolute;opacity:0}.src img{width:100%;background:#000}.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src:has(input:checked){border-color:var(--red);background:var(--bg2)}
.bn{height:110px;background-size:cover;background-position:center;border:1px solid var(--lns)}
.pc2{display:flex;align-items:flex-end;gap:12px;margin:-36px 14px 0;position:relative}.pc2 .av{border:5px solid var(--bg)}
#st{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;font-weight:600;font-size:13px;max-width:90vw;z-index:60}#st:empty{display:none}
/* configurações */
#set{position:fixed;inset:12px;background:var(--bg);border:2px solid var(--fg);display:grid;grid-template-columns:260px 1fr;z-index:30;animation:rv .25s ease both}
#sn{background:var(--bg2);border-right:1px solid var(--lns);padding:18px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
#sn .sc{display:flex;align-items:center;gap:10px;padding:0 6px 14px;border-bottom:1px solid var(--ln);margin-bottom:10px}
#sn .tag{padding:12px 6px 4px}
.sni{text-align:left;padding:8px 10px;border-left:3px solid transparent;color:var(--mu)}.sni:hover{background:var(--bg3);color:var(--fg)}.sni.on{background:var(--bg3);color:var(--fg);border-left-color:var(--red)}.sni.rd{color:var(--rt)}
#sc{overflow-y:auto;padding:26px 40px 40px}#sc>div{max-width:640px;display:grid;gap:16px}
#sc h1{font-size:54px}#sx{position:absolute;right:18px;top:16px;display:grid;justify-items:center;gap:2px;z-index:2}

.sec{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--lns)}.sec>.tag{color:var(--rt)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{border:2px solid var(--ln);padding:10px 14px;min-width:120px;text-align:left;display:grid;gap:8px}.opt:hover{border-color:var(--fg)}.opt.on{border-color:var(--red);background:var(--bg2)}
.pv{height:38px;border:1px solid var(--lns);display:flex}.pv i{flex:1}
.sw{width:44px;height:44px;border:2px solid var(--ln);position:relative}.sw.on{border-color:var(--fg)}.sw.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#EEE6DD;font-weight:800}
.tg{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--ln)}
.sw2{width:46px;height:24px;border:2px solid var(--fg);position:relative;flex:none}.sw2::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--fg);transition:transform .2s}.sw2.on{background:var(--red);border-color:var(--red)}.sw2.on::after{transform:translateX(22px);background:var(--on)}
.sr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--ln)}.sr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd{width:14px;height:14px;flex:none}.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ch2{padding:2px 8px;border:2px solid var(--c);color:var(--c);font:800 10px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.6}.ch2.on{opacity:1;background:var(--c);color:#EEE6DD}

.upl{display:flex;align-items:center;gap:14px}

</style></head><body>
<nav id="rail" aria-label="Servidores"></nav>
<aside id="side">
  <div id="sh"><form id="sf" style="width:100%"><input id="q" placeholder="Buscar ou iniciar conversa" autocomplete="off" aria-label="Buscar"></form><button id="svh" class="svh" data-act="smenu" hidden></button></div>
  <div class="scroll" id="sl"></div>

async function pick(){let srcs=[];try{if(window.api)srcs=await api.sources()}catch(e){}
  const grid=srcs.length?'<div class="grid">'+srcs.map((s,i)=>`<label class="src"><input type="radio" name="s" value="${esc(s.id)}" ${i?'':'checked'}><img src="${s.thumb}" alt=""><span>${esc(s.name)}</span></label>`).join('')+'</div>':'<small>O navegador vai perguntar o que compartilhar.</small>';
  modal(`<h3 class="disp">O que compartilhar?</h3>${grid}<label class="fl"><span class="tag">Qualidade</span><select name="q">${qopts.map(([k,l])=>`<option value="${k}" ${cfg.q==k?'selected':''}>${l}</option>`).join('')}</select></label><label class="fl"><span class="tag">Foco</span><select name="f"><option value="detail">Nitidez (texto, programas)</option><option value="motion">Fluidez (jogos, vídeos)</option></select></label>`,fd=>startShare(fd.get('s'),fd.get('q'),fd.get('f')),'Transmitir')}
async function startShare(id,q,fo){try{screenStream=await capture(id,q)}catch(e){screenStream=null;return st('Não foi possível compartilhar a tela.')}
  shareQ=q;const vt=screenStream.getVideoTracks()[0];vt.contentHint=fo||'detail';vt.onended=()=>stopShare();
  showStream(null,true,(qopts.find(x=>x[0]==q)||['',''])[1].replace(/ \(.*\)/,''));Object.keys(pcs).filter(k=>k.startsWith('voice:')).forEach(k=>shareTo(k.slice(6)));updateUI()}
function pref(c){try{c.getTransceivers().forEach(t=>{if(t.sender&&t.sender.track&&t.sender.track.kind=='video'&&t.setCodecPreferences){
  const cs=RTCRtpSender.getCapabilities('video').codecs,h=cs.filter(x=>/h264/i.test(x.mimeType)),o=cs.filter(x=>!/h264/i.test(x.mimeType));if(h.length)t.setCodecPreferences([...h,...o])}})}catch(e){}}
async function shareTo(code){const key='screen:'+code;closePc(key);const pc=pcs[key]=mkpc(code,'screen');
  screenStream.getTracks().forEach(t=>pc.addTrack(t,screenStream));pref(pc);
  await pc.setLocalDescription(await pc.createOffer());wsend({t:'sig',to:code,k:'screen',d:{sdp:pc.localDescription}});
  const tune=()=>{try{pc.getSenders().forEach(s=>{if(s.track&&s.track.kind=='video'){const p=s.getParameters();if(!p.encodings||!p.encodings.length)p.encodings=[{}];p.encodings[0].maxBitrate=Q[shareQ][3];p.encodings[0].maxFramerate=Q[shareQ][2];s.setParameters(p)}})}catch(e){}};
  pc.onconnectionstatechange=()=>{if(pc.connectionState=='connected')tune()};setTimeout(tune,1500)}
function stopShare(){if(!screenStream)return;screenStream.getTracks().forEach(t=>t.stop());screenStream=null;Object.keys(pcs).filter(k=>k.startsWith('screen:')).forEach(k=>{wsend({t:'sig',to:k.slice(7),k:'screen',d:{stop:1}});closePc(k)});hideStream();updateUI()}

/* ---------- popovers e modais ---------- */
function openPop(html,cls){const p=$('pop');p.className=cls||'';p.innerHTML=html;p.hidden=false}
function userPop(){const sts=[['online','Disponível'],['idle','Ausente'],['dnd','Não perturbe'],['invisible','Invisível']];
  openPop(`<div class="bn" style="${bnStyle(me.banner,me.code)}"></div><div class="pc">${av(me.code,64,me.name,1)}<i class="dot ${myStat()}"></i></div><div class="pb"><b class="disp">${esc(me.name)}</b><br><small>@${esc(me.user)} · #${esc(me.tag)}</small></div>
  <div class="pl2"><button data-act="prof">${ic('user')} Editar perfil</button><button data-act="set">${ic('gear')} Configurações</button><button data-act="code">Copiar meu usuário</button></div>
  <div class="pl2">${sts.map(([k,l])=>`<button data-act="status" data-k="${k}"><i class="dot ${k=='invisible'?'offline':k}" style="position:static;border-color:var(--bg);flex:none"></i> ${l}${me.status==k?' ✓':''}</button>`).join('')}</div>`)}
function srvMenu(){const s=srvById(cs);if(!s)return;const mg=canManage(s);
  openPop((mg?`<button data-act="invite">Convidar amigos</button><button data-act="ssett">Configurações do servidor</button><button data-act="newch" data-t="t">Criar canal</button>`:'')+(s.owner==me.code?`<button class="rd" data-act="delsrv">Excluir servidor</button>`:`<button class="rd" data-act="leavesrv">Sair do servidor</button>`),'sv')}
function showProfile(c){const p=prof(c),n=p.name||nameOf(c),mine=c==me.code,fr=friends.find(f=>f.code==c);
  modal(`<div class="bn" style="${bnStyle(p.banner,c)}"></div><div class="pc2">${av(c,76,n,1)}<div><b class="disp" style="font-size:30px">${esc(n)}</b> <small>#${esc(p.tag||'0000')}</small></div></div><small>@${esc(p.user||'')}</small>`,()=>mine?openSettings('perfil'):(fr?open_(dm(c)):0),mine?'Editar perfil':(fr?'Mandar mensagem':'OK'))}
function newServer(){let icn='';modal(`<h3 class="disp">Criar servidor</h3><div class="upl"><label class="upi" id="upv">${ic('cam')}<input type="file" id="fi" accept="image/*" hidden></label><small>Escolha uma foto para o servidor</small></div><label class="fl"><span class="tag">Nome</span><input name="n" maxlength="32" required></label><label class="fl"><span class="tag">Descrição</span><input name="d" maxlength="160"></label>`,fd=>{
    const n=fd.get('n').trim();if(!n)return;wsend({t:'sNew',name:n,desc:fd.get('d').trim(),icon:icn})},'Criar');
  $('fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;icn=await imgJpeg(f,128,128,.85);const u=$('upv');u.style.backgroundImage=`url('${burl(icn)}')`;u.classList.add('has')}}
function newCh(s,t){modal(`<h3 class="disp">Criar canal</h3><div class="row2"><label class="ck"><input type="radio" name="t" value="t" ${t!='v'?'checked':''}> Texto</label><label class="ck"><input type="radio" name="t" value="v" ${t=='v'?'checked':''}> Voz</label></div><label class="fl"><span class="tag">Nome do canal</span><input name="n" maxlength="24" required></label>`,fd=>{
  const n=fd.get('n').trim();if(!n)return;wsend({t:'sChanAdd',id:s.id,n,ch:fd.get('t')=='v'?'v':'t'})},'Criar')}
function inviteM(s){const l=friends.filter(f=>!mem(s,f.code));if(!l.length)return st('Todos os seus amigos já estão no servidor.');
  modal(`<h3 class="disp">Convidar amigos</h3>`+l.map(f=>`<label class="ck"><input type="checkbox" name="m" value="${esc(f.code)}">${esc(f.name)}</label>`).join(''),fd=>{const sel=fd.getAll('m');if(!sel.length)return;wsend({t:'sInv',id:s.id,ids:sel});st('Convites enviados.')},'Convidar')}
function leaveSrv(s){confirmM('Sair de '+s.name+'?',()=>{if(inCall&&inCall.sid==s.id)leaveCall();wsend({t:'sLeave',id:s.id})},'Sair')}
function delSrv(s){confirmM('Excluir '+s.name+' para todos?',()=>{if(inCall&&inCall.sid==s.id)leaveCall();wsend({t:'sDel',id:s.id})},'Excluir')}
function srvSettings(s){let pi=null,nm=s.name,ds=s.desc;const m=$('modal');
  const rs=()=>{const ico=pi||s.icon;
    const roles=s.roles.map((r,i)=>`<div class="sr"><i class="cd" style="background:${r.color}"></i><span class="nm">${esc(r.name)}${r.manage?' <small>· gerencia</small>':''}</span>${i?`<button class="ib" data-sa="delrole" data-r="${esc(r.id)}" title="Excluir cargo">${ic('trash')}</button>`:''}</div>`).join('');
    const mems=s.members.map(x=>`<div class="sr">${av(x.c,28,nameOf(x.c),1)}<span class="nm">${esc(nameOf(x.c))}${x.c==s.owner?' · dono':''}</span><span class="chips">${s.roles.map(r=>`<button class="ch2 ${x.r.includes(r.id)||(x.c==s.owner&&r.id==s.roles[0].id)?'on':''}" style="--c:${r.color}" data-sa="togrole" data-m="${esc(x.c)}" data-r="${esc(r.id)}">${esc(r.name)}</button>`).join('')}</span>${x.c!=s.owner&&x.c!=me.code?`<button class="ib" data-sa="kick" data-m="${esc(x.c)}" title="Remover do servidor">${ic('close')}</button>`:''}</div>`).join('');
    const chs=s.chans.map(c=>`<div class="sr"><span class="hi">${ic(c.t=='v'?'vol':'hash')}</span><span class="nm">${esc(c.n)}</span><button class="ib" data-sa="delch" data-c="${esc(c.id)}" title="Excluir canal">${ic('trash')}</button></div>`).join('');
    m.innerHTML=`<div id="mf" class="wide"><h3 class="disp">Configurações do servidor</h3>
    <div class="sec"><span class="tag">Visão geral</span><div class="upl"><label class="upi ${ico?'has':''}" id="upv" style="${ico?`background-image:url('${burl(ico)}')`:''}">${ic('cam')}<input type="file" id="fi" accept="image/*" hidden></label><div style="flex:1;display:grid;gap:8px"><input id="sn1" value="${esc(nm)}" maxlength="32" aria-label="Nome"><input id="sd1" value="${esc(ds)}" maxlength="160" placeholder="Descrição" aria-label="Descrição"></div></div><div><button class="btn red sm" data-sa="save">Salvar</button></div></div>
    <div class="sec"><span class="tag">Cargos</span>${roles}<div class="row2" style="align-items:center"><input id="rn" placeholder="Novo cargo" maxlength="24" style="flex:1;min-width:120px"><input id="rc" type="color" value="#2F6B4F" style="width:48px;padding:2px" aria-label="Cor"><label class="ck"><input type="checkbox" id="rm1"> Pode gerenciar</label><button class="btn sm" data-sa="addrole">Criar</button></div></div>
    <div class="sec"><span class="tag">Membros</span>${mems}</div><div class="sec"><span class="tag">Canais</span>${chs}</div><div class="row"><button class="btn" data-sa="close">Fechar</button></div></div>`;
    $('fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;pi=await imgJpeg(f,128,128,.85);rs()}};
  m.oninput=e=>{if(e.target.id=='sn1')nm=e.target.value;if(e.target.id=='sd1')ds=e.target.value};
  m.onclick=e=>{const b=e.target.closest('[data-sa]');if(!b)return;const a=b.dataset.sa,d=b.dataset;
    if(a=='close'){m.classList.remove('on');m.onclick=m.oninput=null;srvModal=null;return}
    if(!canManage(s))return st('Você não tem permissão para isso.');
    if(a=='save'){wsend({t:'sEdit',id:s.id,name:nm.trim(),desc:ds.trim(),...(pi?{icon:pi}:{})});pi=null;st('Servidor atualizado.')}
    else if(a=='addrole'){const n=$('rn').value.trim();if(!n)return st('Dê um nome ao cargo.');wsend({t:'sRoleAdd',id:s.id,name:n,color:$('rc').value,manage:$('rm1').checked})}
    else if(a=='delrole')wsend({t:'sRoleDel',id:s.id,r:d.r});
    else if(a=='togrole'){const x=mem(s,d.m);if(!x||d.m==s.owner)return;wsend({t:'sMemRole',id:s.id,m:d.m,r:d.r,on:!x.r.includes(d.r)})}
    else if(a=='kick')wsend({t:'sKick',id:s.id,m:d.m});
    else if(a=='delch')wsend({t:'sChanDel',id:s.id,ch:d.c});
    rs()};
  srvModal={id:s.id,rs};rs();m.classList.add('on')}

 conta:()=>`<h1 class="disp">Minha conta</h1><div class="sec"><span class="tag">Identidade</span><div class="upl">${av(me.code,64,me.name,1)}<div class="un"><b style="font-size:18px">${esc(me.name)} <small>#${esc(me.tag)}</small></b><small>@${esc(me.user)}</small></div><button class="btn sm" data-act="code">Copiar usuário</button></div></div>
  <div class="sec"><span class="tag">Status</span><div class="opts">${[['online','Disponível'],['idle','Ausente'],['dnd','Não perturbe'],['invisible','Invisível']].map(([k,l])=>`<button class="opt ${me.status==k?'on':''}" data-act="status" data-k="${k}"><span class="tag">${l}</span></button>`).join('')}</div></div>

  <div class="sec"><span class="tag">Código de recuperação</span><p class="mu">Perdeu o código? Gere um novo (o antigo deixa de valer). Confirme com sua senha.</p><div class="row2"><input id="rc_pw" type="password" placeholder="Sua senha" autocomplete="current-password" style="max-width:240px"><button class="btn sm" data-act="recgen">Gerar novo código</button></div></div>`,
 perfil:()=>`<h1 class="disp">Perfil</h1><div><div class="bn" id="pbn" style="${bnStyle(pend.b,me.code)}"></div><div class="pc2"><div id="pav">${pend.a?`<img class="av" src="${burl(pend.a)}" alt="">`:av(me.code,76,me.name,1)}</div></div></div>
  <div class="row2"><label class="btn sm">Banner<input type="file" id="pfb" accept="image/*" hidden></label><label class="btn sm">Ícone<input type="file" id="pfa" accept="image/*" hidden></label></div>
  <label class="fl"><span class="tag">Nome</span><input id="pn" value="${esc(me.name)}" maxlength="20"></label><label class="fl"><span class="tag">Número (#)</span><input id="pt" value="${esc(me.tag)}" inputmode="numeric" maxlength="4"></label><div><button class="btn red" data-act="psave">Salvar</button></div>`,
 aparencia:()=>`<h1 class="disp">Aparência</h1><div class="sec"><span class="tag">Tema</span><div class="opts">${[['light','Claro','#EEE6DD','#1E140B'],['dark','Escuro','#17110d','#EEE6DD'],['sys','Sistema','#EEE6DD','#17110d']].map(([k,l,a,b])=>`<button class="opt ${cfg.theme==k?'on':''}" data-act="theme" data-k="${k}"><span class="pv"><i style="background:${a}"></i><i style="background:${b}"></i></span><span class="tag">${l}</span></button>`).join('')}</div></div>
  <div class="sec"><span class="tag">Paleta de destaque</span><div class="opts">${Object.entries(PAL).map(([k,p])=>`<button class="sw ${cfg.pal==k?'on':''}" style="background:${p[1]}" data-act="pal" data-k="${k}" title="${p[0]}" aria-label="${p[0]}"></button>`).join('')}</div><small>${PAL[cfg.pal][0]}</small></div>
  <div class="sec"><span class="tag">Movimento</span><button class="tg" data-act="rm"><span>Reduzir animações<br><small>Remove transições e entradas animadas.</small></span><i class="sw2 ${cfg.rm?'on':''}"></i></button></div>`,
 voz:()=>`<h1 class="disp">Voz e vídeo</h1><div class="sec"><span class="tag">Microfone</span><select id="smic" aria-label="Microfone"><option value="">Padrão do sistema</option></select><small>Vale a partir da próxima call. Se a lista vier vazia, entre em uma call uma vez para autorizar o microfone.</small></div>
  <button class="tg" data-act="ns"><span>Reduzir ruído de fundo</span><i class="sw2 ${cfg.ns?'on':''}"></i></button>
  <div class="sec"><span class="tag">Compartilhamento de tela</span><select id="sq" aria-label="Qualidade padrão">${qopts.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><small>Mais qualidade usa mais internet e processador. Cada pessoa assistindo é uma transmissão separada.</small></div>`,
 sobre:()=>`<h1 class="disp">Sobre</h1><div class="sec"><span class="tag">Versão</span><b class="disp" style="font-size:44px">ECHOO ${esc(APP_VERSION.startsWith('__')?'':APP_VERSION)}</b><small id="ver2"></small><p class="mu">Chat e comunidades com servidor central: contas, amigos, mensagens guardadas, servidores com cargos e canais, e call com compartilhamento de tela.</p></div>`};
function openSettings(sec){if(sec)setSec=sec;pend={a:me.avatar||'',b:me.banner||''};$('set').hidden=false;$('pop').hidden=true;renderSettings()}
function renderSettings(){const nav=[['conta','Minha conta'],['perfil','Perfil'],['aparencia','Aparência'],['voz','Voz e vídeo'],['sobre','Sobre']];
  $('set').innerHTML=`<div id="sn"><div class="sc"><span>${av(me.code,40,me.name,1)}</span><div class="un"><b>${esc(me.name)}</b><small>#${esc(me.tag)}</small></div></div><div class="tag mu">Usuário</div>${nav.map(([k,l])=>`<button class="sni ${setSec==k?'on':''}" data-act="sn" data-k="${k}">${l}</button>`).join('')}<div class="tag mu">Aplicativo</div><button class="sni rd" data-act="wipe">Sair da conta</button></div><div id="sc"><div class="rv">${SEC[setSec]()}</div></div><div id="sx"><button class="ib" data-act="sx" aria-label="Fechar">${ic('close')}</button><span class="tag mu">ESC</span></div>`;
  if(setSec=='voz'){$('sq').value=cfg.q;fillMics()}
  if(setSec=='sobre'&&window.api&&api.version)api.version().then(v=>{const e=$('ver2');if(e)e.textContent='Aplicativo de computador (janela e instalador) '+v+'. As novidades do app chegam sozinhas, sem reinstalar.'})}
async function fillMics(){const s=$('smic');if(!s)return;try{const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=='audioinput'&&d.deviceId&&d.deviceId!='default');
  s.innerHTML='<option value="">Padrão do sistema</option>'+ds.map(d=>`<option value="${esc(d.deviceId)}">${esc(d.label||'Microfone')}</option>`).join('');s.value=cfg.mic}catch(e){}}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const t=e.target,b=t.closest('[data-act]');
  if(!t.closest('#pop')&&!(b&&['upop','smenu'].includes(b.dataset.act)))$('pop').hidden=true;
  if(!b)return;const a=b.dataset.act,d=b.dataset,s=srvById(d.s||cs),c=s&&s.chans.find(x=>x.id==d.c);
  switch(a){
  case 'home':cs=null;cur=null;renderAll();break;
  case 'dm':open_(dm(d.d));break;
  case 'srv':{const k=(lastCh[s.id]||'').split(':')[1],x=s.chans.find(y=>y.id==k&&y.t=='t')||s.chans.find(y=>y.t=='t');cs=s.id;open_(srvCh(s,x));break}
  case 'ch':if(c)open_(srvCh(s,c));break;
  case 'vch':if(c){const k=s.id+':'+c.id;inCall&&inCall.id==k?leaveCall():joinCall(srvCh(s,c))}break;
  case 'tab':tab=d.k;renderHome();break;
  case 'acc':wsend({t:'reqAcc',from:d.c});break;
  case 'dec':wsend({t:'reqDec',from:d.c});break;
  case 'cnl':wsend({t:'reqCnl',to:d.c});break;
  case 'unf':confirmM('Remover '+nameOf(d.c)+' dos amigos?',()=>wsend({t:'unf',code:d.c}),'Remover');break;
  case 'req':sendReq(d.c);break;
  case 'joink':{const o=chByKey(d.k);if(o)o.ch.k=='dm'?startRing(o.ch):joinCall(o.ch);break}
  case 'call':if(cur)startRing(cur);break;
  case 'ra':acceptRing();break;case 'rd':declineRing();break;case 'rc':cancelRing();break;
  case 'addsrv':newServer();break;
  case 'smenu':$('pop').hidden||$('pop').className!='sv'?srvMenu():$('pop').hidden=true;break;
  case 'upop':$('pop').hidden||$('pop').className=='sv'?userPop():$('pop').hidden=true;break;
  case 'newch':{const sv=srvById(cs);if(sv&&canManage(sv))newCh(sv,d.t)}break;
  case 'invite':{const sv=srvById(cs);sv&&inviteM(sv)}break;
  case 'ssett':{const sv=srvById(cs);sv&&srvSettings(sv)}break;
  case 'leavesrv':{const sv=srvById(cs);sv&&leaveSrv(sv)}break;
  case 'delsrv':{const sv=srvById(cs);sv&&delSrv(sv)}break;
  case 'status':wsend({t:'prof',status:d.k});break;
  case 'prof':openSettings('perfil');break;case 'set':openSettings();break;
  case 'sn':setSec=d.k;renderSettings();break;case 'sx':$('set').hidden=true;break;
  case 'theme':cfg.theme=d.k;saveCfg();applyTheme();renderSettings();break;
  case 'pal':cfg.pal=d.k;saveCfg();applyTheme();renderSettings();break;
  case 'rm':cfg.rm=!cfg.rm;saveCfg();applyTheme();renderSettings();break;
  case 'ns':cfg.ns=!cfg.ns;saveCfg();renderSettings();break;
  case 'psave':wsend({t:'prof',name:($('pn').value.trim()||me.name).slice(0,20),tag:$('pt').value,avatar:pend.a,banner:pend.b});st('Perfil salvo.');break;
  case 'wipe':confirmM('Sair da conta neste dispositivo?',()=>{wsend({t:'logout',token:tok});try{localStorage.removeItem('d2tok')}catch(x){}location.reload()},'Sair');break;
  case 'mic':toggleMic();break;case 'deaf':toggleDeaf();break;
  case 'scr':screenStream?stopShare():pick();break;
  case 'leave':leaveCall();break;case 'fs':fsToggle();break;case 'stopv':stopShare();break;
  case 'card':showProfile(d.c);break;
  case 'code':try{navigator.clipboard.writeText(me.user);st('Usuário copiado.')}catch(x){}break;
  case 'amode':authMode=d.m||'login';showAuth('');break;
  case 'chpw':wsend({t:'chpw',old:$('pw_old').value,pass:$('pw_new').value});break;
  case 'recgen':wsend({t:'recGen',pass:$('rc_pw').value});break}
  if(a!='upop'&&a!='smenu')$('pop').hidden=true});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id=='pfb'&&t.files[0]){pend.b=await imgJpeg(t.files[0],480,160,.8);$('pbn').style.cssText=bnStyle(pend.b)}
  if(t.id=='pfa'&&t.files[0]){pend.a=await imgJpeg(t.files[0],128,128,.85);$('pav').innerHTML=`<img class="av" src="${burl(pend.a)}" alt="">`}
  if(t.id=='sq'){cfg.q=t.value;saveCfg()}if(t.id=='smic'){cfg.mic=t.value;saveCfg()}});
document.addEventListener('submit',e=>{
  if(e.target.id=='af'){e.preventDefault();const v=$('ac').value.trim();if(v.length>=2)wsend({t:'search',q:v});else st('Digite pelo menos 2 letras.')}
  if(e.target.id=='af2'){e.preventDefault();const s=$('a_srv');if(s){try{localStorage.setItem('d2srv',JSON.stringify(s.value.trim()))}catch(x){}}
    const o={t:authMode=='login'?'login':authMode=='reg'?'register':'reset',user:$('a_user').value.trim(),pass:$('a_pass').value};if(authMode=='reg')o.name=$('a_name').value.trim();if(authMode=='forgot')o.code=$('a_code').value.trim();
